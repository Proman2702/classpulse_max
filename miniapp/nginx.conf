server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Файлы с хешем в имени можно кешировать надолго.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Публичная конфигурация записывается при каждом запуске контейнера.
  location = /config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # Одностраничное приложение: все остальные пути отдают index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
